<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Day Counter</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#151c30; --text:#f4f7ff; --muted:#aab4ca; --accent:#a7f3d0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family: ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(ellipse at top,#1d3150 0%,var(--bg) 60%); }
    main { width:min(100%,460px); text-align:center; padding:clamp(28px,8vw,48px) 24px; border:1px solid #ffffff18; border-radius:28px; background:linear-gradient(145deg,#1b263cdd,var(--panel)ee); box-shadow:0 24px 80px #0005; }
    .eyebrow { font-size:.78rem; letter-spacing:.2em; font-weight:700; color:var(--accent); text-transform:uppercase; }
    h1 { font-size:clamp(2.2rem,10vw,4rem); line-height:1.05; margin:18px 0 10px; letter-spacing:-.055em; }
    .date { color:var(--muted); font-size:1rem; }
    .rule { height:1px; background:#ffffff18; margin:28px 0 22px; }
    .label { color:var(--muted); font-size:.9rem; margin-bottom:7px; }
    .start { font-weight:600; font-size:1.05rem; }
    .note { margin:28px 0 0; color:var(--muted); font-size:.82rem; line-height:1.6; }
    .calendar { font-size:2rem; margin-bottom:16px; }
  </style>
</head>
<body>
  <main aria-live="polite">
    <div class="calendar" aria-hidden="true">✦</div>
    <div class="eyebrow">My day counter</div>
    <h1 id="count">Day —</h1>
    <div class="date" id="today">Loading today's date…</div>
    <div class="rule"></div>
    <div class="label">The journey started</div>
    <div class="start" id="start-date">October 24, 2026</div>
    <p class="note">Every new calendar day brings a new number.<br>You don't need to open this page for it to keep counting.</p>
  </main>
  <script>
    // Day 1 is the start date. Change this date if you'd like a different starting point.
    const START_DATE = "2026-10-24";
    const [year, month, day] = START_DATE.split("-").map(Number);
    const start = new Date(year, month - 1, day);
    const today = new Date();
    const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const daysElapsed = Math.round((todayMidnight - start) / 86400000);
    const count = document.getElementById("count");
    if (daysElapsed < 0) {
      count.textContent = "Not started";
    } else {
      count.textContent = "Day " + (daysElapsed + 1);
    }
    document.getElementById("today").textContent = today.toLocaleDateString(undefined, {
      weekday: "long", year: "numeric", month: "long", day: "numeric"
    });
    document.getElementById("start-date").textContent = start.toLocaleDateString(undefined, {
      year: "numeric", month: "long", day: "numeric"
    });
  </script>
</body>
</html>
